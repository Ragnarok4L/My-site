<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <!-- ESSENCIAL pro celular -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Site</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        header {
            background-color: #333;
            color: white;
            padding: 15px;
            text-align: center;
        }

        nav {
            background-color: #555;
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 5px;
        }

        nav a:hover {
            background-color: #777;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        .card {
            background-color: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
        }

        /* =======================
           📱 MOBILE DE VERDADE
        ======================== */
        @media screen and (max-width: 600px) {

            body {
                background-color: #e9e9e9;
            }

            header h1 {
                font-size: 20px;
            }

            nav {
                flex-direction: column;
                align-items: stretch;
            }

            nav a {
                background-color: #444;
                margin: 5px 10px;
                text-align: center;
                padding: 12px;
                font-size: 16px;
            }

            .container {
                padding: 10px;
            }

            .card {
                font-size: 14px;
                padding: 12px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Meu Primeiro Site Do Zero</h1>
    <p>Feito por: Logan.V</p>
</header>

<nav>
    <a href="#">Início</a>
    <a href="#">Sobre</a>
    <a href="#">Contato</a>
</nav>

<div class="container">
    <div class="card">
        <h2>Bem-vindo</h2>
        <p>Esse é um site simples feito em HTML e CSS.</p>
    </div>

    <div class="card">
        <h2>Sobre</h2>
        <p>Ainda em andamento.</p>
    </div>
</div>

<footer>
    <p>© 2026 Meu Site</p>
</footer>

</body>
</html>
