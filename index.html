<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Site</title>

    <style>
  /* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* BODY */
body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: radial-gradient(circle at top, #0f0f1a, #050510);
    color: #e0e0ff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    animation: fadeIn 1s ease-in;
}

/* HEADER */
header {
    background: linear-gradient(90deg, #ff00cc, #3333ff);
    color: white;
    text-align: center;
    padding: 30px 20px;
    box-shadow: 0 0 20px #ff00cc;
    animation: slideDown 0.8s ease-out;
}

header h1 {
    font-size: 30px;
    text-shadow: 0 0 10px #fff, 0 0 20px #ff00cc;
}

header p {
    opacity: 0.8;
}

/* NAV */
nav {
    background-color: #080814;
    display: flex;
    justify-content: center;
    gap: 15px;
    padding: 12px;
    border-bottom: 1px solid #ff00cc;
}

nav a {
    color: #00f7ff;
    text-decoration: none;
    font-weight: bold;
    padding: 10px 15px;
    border: 1px solid transparent;
    border-radius: 6px;
    transition: 0.3s;
}

nav a:hover {
    border: 1px solid #00f7ff;
    box-shadow: 0 0 10px #00f7ff;
    background-color: rgba(0, 247, 255, 0.1);
}

/* CONTAINER */
.container {
    max-width: 900px;
    margin: auto;
    padding: 25px;
    flex: 1;
}

/* CARDS */
.card {
    background: rgba(20, 20, 40, 0.8);
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 10px;
    border: 1px solid #00f7ff;
    box-shadow: 0 0 15px rgba(0,247,255,0.2);

    opacity: 0;
    transform: translateY(40px);
    animation: subir 0.8s ease forwards;
}

.card:nth-child(1) {
    animation-delay: 0.3s;
}
.card:nth-child(2) {
    animation-delay: 0.6s;
}

/* TITULOS */
.card h2 {
    color: #ff00cc;
    margin-bottom: 10px;
    text-shadow: 0 0 10px #ff00cc;
}

/* HOVER */
.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 0 25px #00f7ff;
}

/* FOOTER */
footer {
    background-color: #050510;
    color: #888;
    text-align: center;
    padding: 12px;
    border-top: 1px solid #ff00cc;
}

/* RESPONSIVO */
@media screen and (max-width: 600px) {

    header h1 {
        font-size: 22px;
    }

    nav {
        flex-direction: column;
        align-items: stretch;
    }

    nav a {
        text-align: center;
    }

    .container {
        padding: 15px;
    }
}

/* ANIMAÇÕES */
@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes slideDown {
    from {
        transform: translateY(-50px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

@keyframes subir {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
    </style>
</head>

<body>

<header>
    <h1>Meu Primeiro Site Do Zero</h1>
    <p>Feito por: Logan.V</p>
</header>

<nav>
    <a href="#">Início</a>
    <a href="#">Sobre</a>
    <a href="#">Contato</a>
</nav>

<div class="container">
    <div class="card">
        <h2>Bem-vindo</h2>
        <p>Esse é um site simples feito em HTML e CSS.</p>
    </div>

    <div class="card">
        <h2>Sobre</h2>
        <p>Ainda em andamento.</p>
    </div>
</div>

<footer>
    <p>© 2026 Meu Site</p>
</footer>

</body>
</html>
